  - url: https://edrys-labs.github.io/module-monaco-editor/
    config:
      editorId: station
      value: |
        // Arduino Nano ESP32: die RGB-LED ist LOW-aktiv
        // (LOW = an, HIGH = aus)
        const int leds[] = {LED_RED, LED_GREEN, LED_BLUE};
        const char* namen[] = {"rot", "gruen", "blau"};

        void setup() {
          Serial.begin(115200);
          for (int i = 0; i < 3; i++) {
            pinMode(leds[i], OUTPUT);
            digitalWrite(leds[i], HIGH);  // aus
          }
        }

        void loop() {
          for (int i = 0; i < 3; i++) {
            digitalWrite(leds[i], LOW);   // an
            Serial.print("Farbe: ");
            Serial.println(namen[i]);
            delay(700);
            digitalWrite(leds[i], HIGH);  // aus
          }
        }
      runCommand: execute
      language: cpp
      theme: auto
      synchronize: true
      readOnly: false
      showLanguageSelector: false
