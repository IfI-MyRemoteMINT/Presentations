        # Willkommen im Remote-Labor mit dem Arduino Nano ESP32

        In diesem Labor programmieren Sie einen echten Mikrocontroller: einen **Arduino Nano ESP32**, der an einem Laptop hier im Raum angeschlossen ist. Sie gehen dabei in drei Schritten vor. Die Räume finden Sie links im Menü.

        | Schritt | Ort       | Was Sie tun                                                       |
        | ------- | --------- | ----------------------------------------------------------------- |
        | 1       | Room 1    | Verstehen: Was ist ein Mikrocontroller, wie funktioniert eine RGB-LED? |
        | 2       | Room 2    | Ausprobieren: Ein Lauflicht im Simulator programmieren            |
        | 3       | Station   | Anwenden: Das Programm auf dem echten Board laufen lassen         |

        Alles läuft im Browser, Sie müssen nichts installieren.

        > An der Station kann immer nur eine Person das Board programmieren. Wenn gerade jemand dort arbeitet, schauen Sie kurz zu oder bereiten Sie sich in Room 2 vor.

        _MyRemoteMINT, TU Bergakademie Freiberg_
