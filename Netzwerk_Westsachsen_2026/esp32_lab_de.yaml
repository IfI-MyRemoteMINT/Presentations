    config:
      content: |-
        # Willkommen im Remote-Labor mit dem Arduino Nano ESP32

        Liebe Teilnehmerinnen und Teilnehmer,

        dieses Labor gibt Ihnen direkten Zugriff auf einen echten Mikrocontroller: einen **Arduino Nano ESP32**, der an einem Laptop hier im Raum angeschlossen ist.

        **So funktioniert es**

        1. Öffnen Sie links im Menü die **Station**.
        2. Ändern Sie den C++-Code im Editor und drücken Sie den **Run**-Knopf.
        3. Die Station kompiliert den Code und lädt ihn auf das Board. Das dauert etwa 15 Sekunden.
        4. Beobachten Sie das Board über die **Kamera** und lesen Sie seine Ausgaben im **Terminal**.

        Alles läuft im Browser, Sie müssen nichts installieren. Die Station selbst ist nur ein Browserfenster und ein kleiner Docker-Container auf einem Laptop.

        > Es kann immer nur eine Person das Board programmieren. Wenn gerade jemand an der Station arbeitet, warten Sie bitte kurz und schauen gemeinsam zu.

        _Ihr CrossLab-Team, TU Bergakademie Freiberg_
