    config:
      content: |-
        # Room 1: Was steckt im Board?

        ## Ein Mikrocontroller ist ein kleiner Computer

        Ein Mikrocontroller vereint Prozessor, Speicher und Ein- und Ausgänge auf einem einzigen Chip. Er steckt in Waschmaschinen, Fahrradtachos und Wetterstationen. Er arbeitet immer nach demselben Prinzip:

        | Eingabe                         | Verarbeitung                    | Ausgabe                          |
        | ------------------------------- | ------------------------------- | -------------------------------- |
        | Sensoren, Taster, Messwerte     | das Programm, das Sie schreiben | LEDs, Motoren, Text am Bildschirm |

        Das ist das **EVA-Prinzip**: Eingabe, Verarbeitung, Ausgabe.

        ## Unser Board: Arduino Nano ESP32

        Auf dem Board sitzt eine **RGB-LED**. Sie besteht aus drei winzigen LEDs in Rot, Grün und Blau. Leuchten mehrere gleichzeitig, mischen sich die Farben: Rot und Grün ergeben Gelb, alle drei ergeben Weiß.

        Jede der drei LEDs hängt an einem eigenen **Pin**, also einem Anschluss des Mikrocontrollers. Das Programm schaltet einen Pin auf `HIGH` (Spannung an) oder `LOW` (Spannung aus).

        > **Besonderheit:** Die RGB-LED dieses Boards ist **LOW-aktiv**. Sie leuchtet, wenn der Pin auf `LOW` steht, und ist aus bei `HIGH`. Das liegt an der Schaltung auf dem Board, nicht am Programm.

        ## Ein Arduino-Programm hat zwei Teile

        ```cpp
        void setup() {
          // läuft einmal beim Start: Pins einrichten
        }

        void loop() {
          // läuft danach immer wieder: LEDs schalten, warten, ...
        }
        ```

        Mit `delay(700)` wartet das Programm 700 Millisekunden. Mit `Serial.println("Text")` schickt es Text an den Rechner, den Sie im Terminal sehen.

        ## Weiter

        In **Room 2** probieren Sie ein Lauflicht im Simulator aus, ganz ohne Hardware.
