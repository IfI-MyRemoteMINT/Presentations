  - url: https://edrys-labs.github.io/module-markdown-it/index.html
    config:
      content: |-
        # Aufgaben an der Station

        Hier läuft Ihr Programm auf dem echten Board. Beachten Sie: Die RGB-LED ist **LOW-aktiv** und die Pins heißen `LED_RED`, `LED_GREEN`, `LED_BLUE`.

        > **Aufgabe 1**: Starten Sie den Beispielcode. Beobachten Sie die RGB-LED in der Kamera und die Farbnamen im Terminal. Passen beide zusammen?

        > **Aufgabe 2**: Übertragen Sie Ihre Lösung aus Room 2 auf das Board: schneller blinken und ein vierter Zustand, in dem alle drei Farben gleichzeitig leuchten. Welche Farbe sehen Sie im Kamerabild?

        > **Aufgabe 3**: Lassen Sie die LED `SOS` morsen (`... --- ...`): kurz = 200 ms, lang = 600 ms, Pause zwischen den Buchstaben = 600 ms. Geben Sie jeden Buchstaben auf dem seriellen Monitor aus.

        > **Denkaufgabe**: Die Kamera zeigt das Board mit Verzögerung. Wie könnten Sie das tatsächliche Timing Ihres Blinkmusters messen, ohne dem Video zu vertrauen?

        ## Hardware

        | Bauteil          | Details                                        |
        | ---------------- | ---------------------------------------------- |
        | Mikrocontroller  | Espressif ESP32-S3 (u-blox NORA-W106)          |
        | RGB-LED          | `LED_RED`, `LED_GREEN`, `LED_BLUE`, LOW-aktiv  |
        | Eingebaute LED   | `LED_BUILTIN` (HIGH-aktiv)                     |
        | Funk             | WLAN, Bluetooth LE                             |
        | Werkzeuge        | `arduino-cli`, Core `arduino:esp32`            |

        Weitere Informationen: [Dokumentation zum Arduino Nano ESP32](https://docs.arduino.cc/hardware/nano-esp32/)
